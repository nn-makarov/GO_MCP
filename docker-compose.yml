services:
  mcp-server:
    build: .
    command: ./mcp-server
    environment:
      # Адрес сервиса PriceTracker. По умолчанию — имя его контейнера в общей
      # docker-сети. Если PriceTracker в другом compose, подключите их одной
      # внешней сетью или укажите здесь его адрес.
      PRICETRACKER_URL: ${PRICETRACKER_URL:-http://pricetracker-app-1:8001}
    restart: unless-stopped

  bot:
    build: .
    command: ./bot
    env_file: .env
    environment:
      MCP_URL: http://mcp-server:8081
    depends_on:
      - mcp-server
    restart: unless-stopped
